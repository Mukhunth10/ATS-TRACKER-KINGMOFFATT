# Render Blueprint — deploys the ATS as a single always-on web service.
# In Render: New → Blueprint → connect the ATS-TRACKER-KINGMOFFATT repo → it
# reads this file. Then set the secret env vars (marked sync:false) in the
# dashboard.
#
# Database: Render Postgres. Create it separately in the Render dashboard
# (New -> PostgreSQL, same region as this service), then run
# `npx prisma migrate deploy` once locally against its External Database URL
# to create the schema, and paste the Internal Database URL below as
# DATABASE_URL (internal, since this service and the database are on Render).
services:
  - type: web
    name: ats-tracker
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # --- Database (Render Postgres) — set in the dashboard ---
      - key: DATABASE_URL
        sync: false
      # --- Who may create an account (share only with your HR testers) ---
      - key: SIGNUP_CODE
        sync: false
      # --- Keep the heavy local embedding model off the 512 MB free instance.
      #     Keyword + evidence scoring still works fully. ---
      - key: SEMANTIC_MATCHING
        value: "off"
      # --- Candidate-facing privacy notice (fill with real details before
      #     sending assessments to real people) ---
      - key: COMPANY_NAME
        value: "King & Moffatt"
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # TODO: confirm King & Moffatt's real data retention policy and replace
      # this placeholder before candidates rely on it — it's shown in the
      # legal privacy notice before they apply.
      - key: DATA_RETENTION
        value: "retained for 12 months from the date of application, then deleted"
      - key: PRIVACY_NOTICE_VERSION
        value: "1"
